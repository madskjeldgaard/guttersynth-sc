name: Build and release plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install 7Zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: Install-Module 7Zip4PowerShell -Force

      - name: Get SuperCollider source
        run: git clone --depth 1 https://github.com/supercollider/supercollider.git ${{ github.workspace }}/supercollider

      - name: Create build directory
        run: cmake -E make_directory ${{ github.workspace }}/build

      - name: Configure CMake (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: ${{ github.workspace }}/build
        run: >
          cmake ..
          -DCMAKE_BUILD_TYPE=Release
          -DSC_PATH=${{ github.workspace }}/supercollider
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/install

      - name: Configure CMake (macOS Universal)
        if: matrix.os == 'macos-latest'
        shell: bash
        working-directory: ${{ github.workspace }}/build
        run: >
          cmake ..
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=x86_64\;arm64
          -DSC_PATH=${{ github.workspace }}/supercollider
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/install

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: ${{ github.workspace }}\build
        run: >
          cmake ..
          -DCMAKE_BUILD_TYPE=Release
          -DSC_PATH=${{ github.workspace }}\supercollider
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\build\install

      - name: Build and install (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        working-directory: ${{ github.workspace }}/build
        run: cmake --build . --config Release --target install

      - name: Build and install (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: ${{ github.workspace }}\build
        run: cmake --build . --config Release --target install

      - name: Archive build (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        working-directory: ${{ github.workspace }}/build
        run: zip -r GutterSynth-${{ runner.os }}.zip install/GutterSynth

      - name: Archive build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: ${{ github.workspace }}\build
        run: Compress-7Zip "install\GutterSynth" -ArchiveFileName "GutterSynth-${{ runner.os }}.zip" -Format Zip

      - name: Create release if needed
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: GutterSynth-${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload binaries to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/build/GutterSynth-${{ runner.os }}.zip
          asset_name: GutterSynth-${{ runner.os }}.zip
          tag: ${{ github.ref_name }}
          overwrite: true
